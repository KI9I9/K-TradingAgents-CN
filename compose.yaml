name: k-tradingagents

x-logging: &logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '3'

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:?请先生成 .env}
      TZ: Asia/Shanghai
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请先生成 .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?请先生成 .env}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, 'redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    image: k-tradingagents-backend:local
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      MONGODB_HOST: mongodb
      REDIS_HOST: redis
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
      - app_runtime:/app/runtime
      - app_results:/app/results
      - app_reports:/app/reports
      - app_uploads:/app/uploads
      - app_config:/app/config
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=5)']
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 180s
    logging: *logging

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    image: k-tradingagents-frontend:local
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-8088}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, 'http://127.0.0.1/']
      interval: 20s
      timeout: 5s
      retries: 5
    logging: *logging

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:
  app_data:
  app_logs:
  app_runtime:
  app_results:
  app_reports:
  app_uploads:
  app_config:
